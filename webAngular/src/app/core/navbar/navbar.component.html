<nav [class.scrolled]="scrolled">
  <div class="inner">

    <a routerLink="/" class="logo" (click)="closeMenu()">
      <div class="logo-badge">
        <img
          src="https://res.cloudinary.com/dzueiucg9/image/upload/w_200,f_auto,q_auto/v1785043531/logo_nuevo_z25u13.png"
          width="60"
          height="60"
          style="width: 80px; height: auto; object-fit: contain;"
          alt="Logo MS Group" />
      </div>
      <div>
        <div class="logo-name">MS Group</div>
        <div class="logo-sub">soluciones profesionales</div>
      </div>
    </a>

    <div class="links">
      <a
        *ngFor="let link of navLinks"
        [routerLink]="link.path"
        [fragment]="link.fragment"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ paths: 'exact', matrixParams: 'ignored', queryParams: 'ignored', fragment: 'exact' }"        class="link"
      >
        {{ link.label }}
      </a>
      <a [href]="whatsappUrl" target="_blank" rel="noreferrer" class="cta">
        Cotizar
      </a>
    </div>

    <button class="hamburger" (click)="toggleMenu()" aria-label="Menú">
      {{ menuOpen ? '✕' : '☰' }}
    </button>
  </div>

  <div class="mobile-menu" *ngIf="menuOpen">
    <a
      *ngFor="let link of navLinks"
      [routerLink]="link.path"
      [fragment]="link.fragment"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ paths: 'exact', matrixParams: 'ignored', queryParams: 'ignored', fragment: 'exact' }"      class="mobile-link"
      class="mobile-link"
      (click)="closeMenu()"
    >
      {{ link.label }}
    </a>
    <a [href]="whatsappUrl" target="_blank" rel="noreferrer" class="mobile-cta" (click)="closeMenu()">
      💬 Cotizar ahora
    </a>
  </div>
</nav>
