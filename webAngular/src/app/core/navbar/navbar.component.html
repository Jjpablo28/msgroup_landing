<nav [class.scrolled]="scrolled">
  <div class="inner">

    <a routerLink="/" class="logo" (click)="closeMenu()">
      <div class="logo-badge">
        <img
          src="https://res.cloudinary.com/dzueiucg9/image/upload/w_200,f_auto,q_auto/v1785043531/logo_nuevo_z25u13.png"
          width="60"
          height="60"
          style="width: 80px; height: auto; object-fit: contain;"
          alt="Logo MS Group" />
      </div>
      <div>
        <div class="logo-name">MS Group</div>
        <div class="logo-sub">soluciones profesionales</div>
      </div>
    </a>

    <div class="links">
      <a
        *ngFor="let link of navLinks"
        [routerLink]="link.path"
        [fragment]="link.fragment"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ paths: 'exact', matrixParams: 'ignored', queryParams: 'ignored', fragment: 'exact' }"
        class="link"
      >
        {{ link.label }}
      </a>
      <a [href]="whatsappUrl" target="_blank" rel="noreferrer noopener" class="cta">
        <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
        Cotizar
      </a>
    </div>

    <button
      class="hamburger"
      (click)="toggleMenu()"
      aria-label="Menú"
      aria-controls="mobile-menu"
      [attr.aria-expanded]="menuOpen"
    >
      <span aria-hidden="true">{{ menuOpen ? '✕' : '☰' }}</span>
    </button>
  </div>

  <!-- Fondo detrás del menú móvil: clic afuera lo cierra -->
  <div class="mobile-backdrop" *ngIf="menuOpen" (click)="closeMenu()"></div>

  <div class="mobile-menu" id="mobile-menu" *ngIf="menuOpen">
    <a
      *ngFor="let link of navLinks"
      [routerLink]="link.path"
      [fragment]="link.fragment"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ paths: 'exact', matrixParams: 'ignored', queryParams: 'ignored', fragment: 'exact' }"
      class="mobile-link"
      (click)="closeMenu()"
    >
      {{ link.label }}
    </a>
    <a [href]="whatsappUrl" target="_blank" rel="noreferrer noopener" class="mobile-cta" (click)="closeMenu()">
      <i class="fa-brands fa-whatsapp" aria-hidden="true"></i> Cotizar ahora
    </a>
  </div>
</nav>
