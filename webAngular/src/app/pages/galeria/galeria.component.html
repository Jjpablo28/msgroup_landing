<section class="gallery-section">
  <div class="container">
    <div class="section-head">
      <div class="eyebrow">Galería</div>
      <h2>Producciónes realizadas por Nosotros</h2>
    </div>

    <!-- REJILLA -->
    <div class="grid">
      <div
        class="item"
        *ngFor="let item of images; let i = index"
        (click)="openLightbox(i)"
      >
        <!-- Si es Video -->
        <ng-container *ngIf="item.type === 'video'; else imgTpl">
          <video [src]="item.url" muted preload="metadata"></video>
          <div class="video-badge">▶ Video</div>
        </ng-container>

        <!-- Si es Imagen -->
        <ng-template #imgTpl>
          <img [src]="item.url" [alt]="item.alt" loading="lazy" />
        </ng-template>

        <div class="item-overlay"></div>
      </div>
    </div>
  </div>
</section>

<!-- LIGHTBOX OPTIMIZADO Y FULLSCREEN -->
<div class="lightbox" *ngIf="selectedIndex !== null" (click)="closeLightbox()">
  <div class="lightbox-inner" (click)="$event.stopPropagation()">
    <button class="close" (click)="closeLightbox()">✕</button>

    <!-- Reproductor de Video -->
    <video
      *ngIf="images[selectedIndex!].type === 'video'"
      [src]="images[selectedIndex!].url"
      controls
      autoplay
      playsinline
      class="lightbox-media"
    ></video>

    <!-- Visualizador de Imagen -->
    <img
      *ngIf="images[selectedIndex!].type !== 'video'"
      [src]="images[selectedIndex!].url"
      [alt]="images[selectedIndex!].alt"
      class="lightbox-media"
    />

    <!-- Navegación -->
    <div class="lightbox-nav">
      <button (click)="prev()">← Anterior</button>
      <span>{{ selectedIndex! + 1 }} / {{ images.length }}</span>
      <button (click)="next()">Siguiente →</button>
    </div>
  </div>
</div>
